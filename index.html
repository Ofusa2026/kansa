<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カンシス｜監査システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#eef1f5; --surface:#ffffff; --surface2:#f7f9fb;
    --ink:#1e2432; --muted:#6a7180; --line:#e2e6ec;
    --primary:#33456b; --primary-d:#26324f; --primary-l:#e8edf6;
    --ok:#157347; --ok-bg:#e6f2ea;
    --warn:#a86910; --warn-bg:#fbf1de;
    --ng:#b02a37; --ng-bg:#f7e6e8;
    --na:#8a93a3; --na-bg:#eef0f3;
    --radius:10px;
    --font: "Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,"Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
  a{color:inherit}
  /* layout */
  .app{display:flex;min-height:100vh}
  .side{width:216px;flex:0 0 216px;background:var(--primary);color:#dfe5f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand b{color:#fff;font-size:18px;letter-spacing:.06em}
  .brand span{display:block;font-size:11px;color:#aab6cf;margin-top:2px}
  .nav{padding:10px 8px;flex:1}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#c7d0e2;
    padding:11px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:#fff;color:var(--primary);font-weight:600}
  .nav .ic{width:18px;text-align:center}
  .navlabel{font-size:10.5px;color:#9aa7c4;letter-spacing:.08em;padding:14px 14px 4px;margin-top:6px;border-top:1px solid rgba(255,255,255,.10)}
  .abclegend{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 36px;max-width:920px}
  .report .rt{font-size:20px;margin:0 0 4px;font-weight:700}
  .report .rh{font-size:15px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--primary)}
  .report .rh3{font-size:13px;margin:16px 0 6px;color:var(--primary)}
  .report table{width:100%;border-collapse:collapse;margin:6px 0 4px}
  .report .kv th{width:96px;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;white-space:nowrap}
  .report .kv td{border:1px solid var(--line);padding:7px 10px;font-size:13px}
  .report .sum th,.report .sum td{border:1px solid var(--line);padding:7px 10px;font-size:12.5px;text-align:center}
  .report .sum th:first-child,.report .sum td:first-child{text-align:left;background:var(--surface2)}
  .report .sum thead th{background:var(--surface2);color:var(--muted)}
  .report .imp th,.report .imp td{border:1px solid var(--line);padding:8px 10px;font-size:12.5px;vertical-align:top;text-align:left}
  .report .imp thead th{background:var(--surface2);color:var(--muted);font-weight:600}
  .report .imp .w-e{width:64px} .report .imp .w-r{width:120px}
  .report .imp .cat{font-size:10.5px;color:var(--muted);margin-bottom:2px}
  .report .imp .note{font-size:11px;color:var(--muted);margin-top:4px}
  .report .imp .ref{color:var(--muted);font-size:11.5px}
  .report .disc{margin-top:26px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  @media print{
    .side,.top,.noprint{display:none!important}
    body{background:#fff}
    .content{padding:0;max-width:none}
    .report{border:none;border-radius:0;padding:0;max-width:none}
    .report .imp td,.report .imp th,.report .kv td,.report .kv th,.report .sum td,.report .sum th{border-color:#999}
  }
  .side .foot{padding:14px 20px;font-size:11px;color:#9aa7c4;border-top:1px solid rgba(255,255,255,.12)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top h1{font-size:17px;margin:0;font-weight:600}
  .top .crumb{color:var(--muted);font-size:12px}
  .top .sp{flex:1}
  .content{padding:24px 26px;max-width:1200px;width:100%}
  /* components */
  .btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600}
  .btn:hover{background:var(--primary-d)}
  .btn.ghost{background:var(--surface);color:var(--primary);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--surface2)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .grid{display:grid;gap:16px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat{padding:18px 20px}
  .stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  .stat.alert .n{color:var(--ng)}
  .sec{margin-top:24px}
  .sec h2{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--ink)}
  table{width:100%;border-collapse:collapse;background:var(--surface)}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--surface2)}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--primary-l)}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .tag.g{background:var(--ok-bg);color:var(--ok)} .tag.a{background:var(--warn-bg);color:var(--warn)}
  .tag.r{background:var(--ng-bg);color:var(--ng)} .tag.n{background:var(--na-bg);color:var(--na)}
  .tag.p{background:var(--primary-l);color:var(--primary)}
  .muted{color:var(--muted)}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .tabs button{background:none;border:none;padding:10px 16px;cursor:pointer;font-size:13.5px;color:var(--muted);font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  /* form */
  .form{display:grid;grid-template-columns:160px 1fr;gap:12px 16px;align-items:center;max-width:760px}
  .form label{color:var(--muted);font-size:13px}
  .form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:var(--surface)}
  .form textarea{min-height:64px;resize:vertical}
  .form .full{grid-column:1/3}
  /* audit checklist */
  .catblock{margin-bottom:18px}
  .cathead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:8px 8px 0 0;font-weight:600;font-size:13.5px}
  .cathead .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
  .qrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;border:1px solid var(--line);border-top:none;align-items:start}
  .qrow:last-child{border-radius:0 0 8px 8px}
  .qtext{font-size:13px}
  .qmeta{font-size:11px;color:var(--muted);margin-top:3px}
  .qnote{margin-top:8px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:12px;display:none}
  .qnote.show{display:block}
  .judge{display:flex;gap:6px;align-items:center}
  .jb{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);font-family:inherit;white-space:nowrap}
  .jb:hover{border-color:var(--primary)}
  .jb.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .jb.on.warn{background:var(--warn);border-color:var(--warn);color:#fff}
  .jb.on.ng{background:var(--ng);border-color:var(--ng);color:#fff}
  .jb.on.na{background:var(--na);border-color:var(--na);color:#fff}
  .notebtn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:11px;font-family:inherit;padding:2px}
  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
  .prog i{display:block;height:100%;background:var(--primary)}
  /* modal / toast */
  .mask{position:fixed;inset:0;background:rgba(20,26,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
  .modal .mb{padding:20px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .x{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
  #toast.show{opacity:1}
  @media(max-width:820px){
    .side{position:fixed;left:-216px;z-index:60;transition:.2s} .side.open{left:0}
    .stats{grid-template-columns:repeat(2,1fr)} .form{grid-template-columns:1fr}
    .menubtn{display:inline-block!important}
  }
  .menubtn{display:none;background:none;border:none;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>カンシス</b><span>登録支援機関 監査システム</span></div>
    <nav class="nav" id="nav">
      <button data-v="mock" class="on"><span class="ic">◎</span>模擬監査</button>
      <button data-v="dashboard"><span class="ic">▤</span>ダッシュボード</button>
      <button data-v="orgs"><span class="ic">▦</span>監査対象機関</button>
      <button data-v="findings"><span class="ic">！</span>指摘管理</button>
      <div class="navlabel">マスタ</div>
      <button data-v="checklist"><span class="ic">✓</span>監査チェックリスト</button>
      <button data-v="docs"><span class="ic">▤</span>保管書類チェックリスト</button>
    </nav>
    <div class="foot">大房行政書士法人<br>内部監査台帳 v0.4</div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="menubtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div><h1 id="title">ダッシュボード</h1><div class="crumb" id="crumb"></div></div>
      <div class="sp"></div>
      <div id="topact"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// ====== 接続設定（アンシスと同じSupabaseプロジェクトのk_テーブル群を使用）======
const SB_URL = "https://ehwlgbwpycglmopiqyty.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVod2xnYndweWNnbG1vcGlxeXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjU2MjgsImV4cCI6MjA4Nzk0MTYyOH0.bBWWSOEZsqQIlf2uMWmfXRL1Tn89y-WfL-7s2DX0JwI";
const sb = supabase.createClient(SB_URL, SB_KEY);

// ====== ヘルパー ======
const $=s=>document.querySelector(s), view=$("#view");
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d?String(d).slice(0,10):"—";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900);}
function setHead(title,crumb,act){$("#title").textContent=title;$("#crumb").innerHTML=crumb||"";$("#topact").innerHTML="";if(act)$("#topact").appendChild(act);}
function btn(label,fn,cls){const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=label;b.onclick=fn;return b;}
function modal(title,bodyHTML,onOK,okLabel){
  const mask=document.createElement("div");mask.className="mask";
  mask.innerHTML=`<div class="modal"><div class="mh">${esc(title)}<button class="x">×</button></div>
    <div class="mb">${bodyHTML}</div><div class="mf"></div></div>`;
  const close=()=>mask.remove();
  mask.querySelector(".x").onclick=close;
  mask.onclick=e=>{if(e.target===mask)close();};
  const mf=mask.querySelector(".mf");
  const c=document.createElement("button");c.className="btn ghost";c.textContent="キャンセル";c.onclick=close;
  const ok=document.createElement("button");ok.className="btn";ok.textContent=okLabel||"保存";
  ok.onclick=async()=>{const r=await onOK(mask);if(r!==false)close();};
  mf.append(c,ok);document.body.appendChild(mask);
  const f=mask.querySelector("input,select,textarea");if(f)f.focus();
  return mask;
}
const val=(mask,name)=>{const e=mask.querySelector(`[name="${name}"]`);return e?e.value.trim():"";};

// ====== ルーター ======
const routes={};
function go(v,arg){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#side").classList.remove("open");view.innerHTML='<div class="empty">読み込み中…</div>';
  (routes[v]||routes.dashboard)(arg);}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

// ====== ダッシュボード ======
routes.dashboard=async()=>{
  setHead("ダッシュボード","");
  const cnt=async(t,f)=>{let q=sb.from(t).select("*",{count:"exact",head:true});if(f)q=f(q);const{count}=await q;return count||0;};
  const [orgs,active,openF,dueF]=await Promise.all([
    cnt("k_audit_orgs"),
    cnt("k_audit_orgs",q=>q.in("audit_status",["監査中","指摘対応中"])),
    cnt("k_findings",q=>q.neq("status","完了")),
    cnt("k_findings",q=>q.neq("status","完了").lte("due_date",new Date().toISOString().slice(0,10))),
  ]);
  const {data:next}=await sb.from("k_audit_orgs").select("id,name,next_audit_date,audit_status")
    .not("next_audit_date","is",null).order("next_audit_date").limit(8);
  const {data:due}=await sb.from("k_v_findings_due").select("*").limit(8);
  view.innerHTML=`
   <div class="grid stats">
     <div class="card stat"><div class="n">${orgs}</div><div class="l">監査対象機関</div></div>
     <div class="card stat"><div class="n">${active}</div><div class="l">監査中・指摘対応中</div></div>
     <div class="card stat"><div class="n">${openF}</div><div class="l">未完了の指摘</div></div>
     <div class="card stat alert"><div class="n">${dueF}</div><div class="l">改善期限 超過</div></div>
   </div>
   <div class="sec"><h2>次回監査予定</h2><div class="card">${
     (next&&next.length)?`<table><thead><tr><th>機関名</th><th>次回監査日</th><th>状態</th></tr></thead><tbody>${
       next.map(o=>`<tr class="click" onclick="go('org','${o.id}')"><td>${esc(o.name)}</td><td>${fmt(o.next_audit_date)}</td><td>${statusTag(o.audit_status)}</td></tr>`).join("")
     }</tbody></table>`:'<div class="empty">予定はありません。機関を登録して次回監査日を設定してください。</div>'
   }</div></div>
   <div class="sec"><h2>改善期限の近い指摘</h2><div class="card">${
     (due&&due.length)?`<table><thead><tr><th>機関名</th><th>指摘</th><th>重要度</th><th>期限</th><th>残り</th></tr></thead><tbody>${
       due.map(f=>`<tr class="click" onclick="go('org','${f.audit_org_id}')"><td>${esc(f.org_name)}</td><td>${esc((f.content||"").slice(0,40))}</td><td>${sevTag(f.severity)}</td><td>${fmt(f.due_date)}</td><td>${f.days_left==null?"—":(f.days_left<0?`<span class="tag r">${-f.days_left}日超過</span>`:`${f.days_left}日`)}</td></tr>`).join("")
     }</tbody></table>`:'<div class="empty">未完了の指摘はありません。</div>'
   }</div></div>`;
};
const statusTag=s=>{const m={"未実施":"n","監査中":"p","指摘対応中":"a","完了":"g"};return `<span class="tag ${m[s]||"n"}">${esc(s||"未実施")}</span>`;};
const sevTag=s=>{const m={"重大":"r","軽微":"a","観察":"n"};return `<span class="tag ${m[s]||"n"}">${esc(s||"軽微")}</span>`;};

// ====== 監査対象機関 一覧 ======
routes.orgs=async()=>{
  setHead("監査対象機関","",btn("＋ 新規機関",newOrg));
  const {data:orgs}=await sb.from("k_audit_orgs").select("*").order("created_at",{ascending:false});
  const {data:of}=await sb.from("k_findings").select("audit_org_id").neq("status","完了");
  const fc={};(of||[]).forEach(f=>fc[f.audit_org_id]=(fc[f.audit_org_id]||0)+1);
  if(!orgs||!orgs.length){view.innerHTML='<div class="card"><div class="empty">まだ機関が登録されていません。「＋ 新規機関」から追加してください。</div></div>';return;}
  view.innerHTML=`<div class="card"><table><thead><tr><th>機関名</th><th>登録番号</th><th>代表者</th><th>次回監査</th><th>状態</th><th>未完了指摘</th></tr></thead><tbody>${
    orgs.map(o=>`<tr class="click" onclick="go('org','${o.id}')">
      <td><b>${esc(o.name)}</b></td><td>${esc(o.reg_no||"—")}</td><td>${esc(o.rep_name||"—")}</td>
      <td>${fmt(o.next_audit_date)}</td><td>${statusTag(o.audit_status)}</td>
      <td>${fc[o.id]?`<span class="tag r">${fc[o.id]}</span>`:'<span class="muted">0</span>'}</td></tr>`).join("")
  }</tbody></table></div>`;
};
function newOrg(){
  const mask=document.createElement("div");mask.className="mask";
  mask.innerHTML=`<div class="modal"><div class="mh">監査対象機関を追加<button class="x">×</button></div>
    <div class="mb">
      <div class="tabs" id="notabs" style="margin-top:0">
        <button data-t="import" class="on">アンシスの登録支援機関から追加</button>
        <button data-t="manual">新規で手入力</button>
      </div>
      <div id="nopane"></div>
    </div></div>`;
  const close=()=>mask.remove();
  mask.querySelector(".x").onclick=close;mask.onclick=e=>{if(e.target===mask)close();};
  document.body.appendChild(mask);
  const pane=mask.querySelector("#nopane");
  const tabs={import:importPane,manual:manualPane};
  mask.querySelectorAll("#notabs button").forEach(b=>b.onclick=()=>{mask.querySelectorAll("#notabs button").forEach(x=>x.classList.toggle("on",x===b));tabs[b.dataset.t]();});
  function importPane(){
    pane.innerHTML=`<input id="soq" placeholder="登録支援機関名で検索…（アンシスのデータ）" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;margin-bottom:10px">
      <div id="solist" class="muted" style="max-height:340px;overflow:auto;font-size:13px">名称を入力すると、アンシスに登録済みの支援機関から候補が出ます。</div>`;
    const q=pane.querySelector("#soq"),list=pane.querySelector("#solist");let t;
    q.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{
      const term=q.value.trim();if(!term){list.innerHTML="名称を入力すると候補が出ます。";return;}
      const {data,error}=await sb.from("support_orgs").select("id,name,display_name,reg_no,rep_name").ilike("name","%"+term+"%").order("name").limit(25);
      if(error){list.innerHTML='<div class="tag r">検索失敗: '+esc(error.message)+'</div>';return;}
      if(!data||!data.length){list.innerHTML='<div class="muted">該当する支援機関がありません。</div>';return;}
      list.classList.remove("muted");
      list.innerHTML=data.map(s=>`<div class="soitem" data-id="${s.id}" style="padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer">
        <b>${esc(s.name||s.display_name||"(名称なし)")}</b> <span class="muted" style="font-size:12px">${esc(s.reg_no||"")} ${esc(s.rep_name||"")}</span></div>`).join("");

async function auditChecklist(auditId){
  const pane=$("#apane");pane.innerHTML='<div class="empty">読み込み中…</div>';
  const {data:master}=await sb.from("k_checklist_master").select("*").eq("active",true).order("sort");
  const {data:res}=await sb.from("k_checklist_results").select("*").eq("audit_id",auditId);
  const rmap={};(res||[]).forEach(r=>rmap[r.master_id]=r);
  const cats={};master.forEach(m=>{(cats[m.category_no]=cats[m.category_no]||{name:m.category,items:[]}).items.push(m);});
  let html="";
  Object.keys(cats).sort((a,b)=>a-b).forEach(cn=>{
    const c=cats[cn];
    html+=`<div class="catblock"><div class="cathead">${cn}. ${esc(c.name)}<span class="cnt" data-cat="${cn}"></span></div>`;
    c.items.forEach(m=>{
      const r=rmap[m.id]||{};const cur=r.result||"";
      html+=`<div class="qrow" data-cat="${cn}">
        <div><div class="qtext">${m.item_no}. ${esc(m.question)}</div>
          <div class="qmeta">${m.ref_page?"別冊 "+esc(m.ref_page):""} <button class="notebtn" onclick="this.closest('.qrow').querySelector('.qnote').classList.toggle('show')">＋備考</button></div>
          <textarea class="qnote ${r.note?"show":""}" data-mid="${m.id}" placeholder="備考・証跡URL">${esc(r.note||"")}</textarea>
        </div>
        <div class="judge" data-mid="${m.id}">
          ${abcBtn("A",cur)}${abcBtn("B",cur)}${abcBtn("C",cur)}
        </div></div>`;
    });
    html+=`</div>`;
  });
  pane.innerHTML=html;
  pane.querySelectorAll(".judge .jb").forEach(b=>b.onclick=async()=>{
    const mid=b.parentElement.dataset.mid, r=b.dataset.r;
    b.parentElement.querySelectorAll(".jb").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    await sb.from("k_checklist_results").update({result:r,checked_at:new Date().toISOString()}).eq("audit_id",auditId).eq("master_id",mid);
    updateProg(auditId);
  });
  pane.querySelectorAll(".qnote").forEach(t=>t.onblur=async()=>{
    await sb.from("k_checklist_results").update({note:t.value.trim()||null}).eq("audit_id",auditId).eq("master_id",t.dataset.mid);
  });
  updateProg(auditId);
}

        <td><div>${esc(d.doc_name.slice(0,80))}${d.doc_name.length>80?"…":""}</div><div class="qmeta">${esc(d.form_no||"")} ／ 保存:${esc(d.keep_period||"")} ／ ${esc(d.ref||"")}</div></td>
        <td><input type="checkbox" data-doc="${d.id}" class="exists" ${r.exists_flag?"checked":""}></td>
        <td><div class="judge" data-doc="${d.id}">${abcBtn("A",cur)}${abcBtn("B",cur)}${abcBtn("C",cur)}</div></td></tr>`;
    }).join("")
  }</tbody></table></div>`;
  pane.querySelectorAll(".exists").forEach(c=>c.onchange=async()=>{await sb.from("k_doc_results").update({exists_flag:c.checked}).eq("audit_id",auditId).eq("doc_id",c.dataset.doc);});
  pane.querySelectorAll(".judge .jb").forEach(b=>b.onclick=async()=>{const doc=b.parentElement.dataset.doc,r=b.dataset.r;
    b.parentElement.querySelectorAll(".jb").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    await sb.from("k_doc_results").update({result:r}).eq("audit_id",auditId).eq("doc_id",doc);});
}

// ====== 監査報告書 ======
window.openReport=async(auditId,orgId)=>{
  view.innerHTML='<div class="empty">読み込み中…</div>';
  const {data:a}=await sb.from("k_audits").select("*,k_audit_orgs(*)").eq("id",auditId).single();
  const org=a.k_audit_orgs||{};
  const [{data:cm},{data:cr},{data:dm},{data:dr}]=await Promise.all([
    sb.from("k_checklist_master").select("*").eq("active",true).order("sort"),
    sb.from("k_checklist_results").select("*").eq("audit_id",auditId),
    sb.from("k_doc_master").select("*").eq("active",true).order("sort"),
    sb.from("k_doc_results").select("*").eq("audit_id",auditId)
  ]);
  const crm={};(cr||[]).forEach(r=>crm[r.master_id]=r);
  const drm={};(dr||[]).forEach(r=>drm[r.doc_id]=r);
  const cnt={A:0,B:0,C:0,none:0};cm.forEach(m=>{const r=(crm[m.id]||{}).result;cnt[['A','B','C'].includes(r)?r:'none']++;});
  const dcnt={A:0,B:0,C:0,none:0};dm.forEach(d=>{const r=(drm[d.id]||{}).result;dcnt[['A','B','C'].includes(r)?r:'none']++;});
  const answered=cnt.A+cnt.B+cnt.C+dcnt.A+dcnt.B+dcnt.C, anyC=cnt.C+dcnt.C>0, anyB=cnt.B+dcnt.B>0;
  const overall=answered===0?'未評価':anyC?'要改善（重大な指摘あり）':anyB?'一部改善が必要':'適合';
  const oc=answered===0?'n':anyC?'r':anyB?'a':'g';
  const probC=cm.filter(m=>['B','C'].includes((crm[m.id]||{}).result)).map(m=>({m,r:crm[m.id]}));
  const probD=dm.filter(d=>['B','C'].includes((drm[d.id]||{}).result)).map(d=>({d,r:drm[d.id]}));
  const evalTag=v=>`<span class="tag ${v==='A'?'g':v==='B'?'a':'r'}">${v}</span>`;
  setHead("監査報告書","",btn("← 監査へ",()=>openAudit(auditId,orgId),"ghost"));
  view.innerHTML=`
   <div class="row noprint" style="justify-content:flex-end;margin-bottom:12px"><button class="btn" onclick="window.print()">印刷 / PDF保存</button></div>
   <div class="report">
     <h1 class="rt">登録支援機関 監査報告書</h1>
     <div class="muted" style="margin-bottom:16px">大房行政書士法人</div>
     <table class="kv"><tbody>
       <tr><th>対象機関</th><td>${esc(org.name||"")}</td><th>登録番号</th><td>${esc(org.reg_no||"—")}</td></tr>
       <tr><th>代表者</th><td>${esc(org.rep_name||"—")}</td><th>監査日</th><td>${fmt(a.audit_date)}</td></tr>
       <tr><th>監査種別</th><td>${esc(a.audit_type||"—")} ／ ${esc(a.method||"—")}</td><th>担当</th><td>${esc(a.auditor||"—")}</td></tr>
     </tbody></table>
     <h2 class="rh">1. 総合評価</h2>
     <p style="margin:0 0 10px">判定：<span class="tag ${oc}">${overall}</span></p>
     <table class="sum"><thead><tr><th></th><th>A 問題なし</th><th>B 一部問題あり</th><th>C 問題あり</th><th>未評価</th></tr></thead><tbody>
       <tr><th>監査チェックリスト（54）</th><td>${cnt.A}</td><td>${cnt.B}</td><td>${cnt.C}</td><td>${cnt.none}</td></tr>
       <tr><th>保管書類（15）</th><td>${dcnt.A}</td><td>${dcnt.B}</td><td>${dcnt.C}</td><td>${dcnt.none}</td></tr>
     </tbody></table>
     <h2 class="rh">2. 改善が必要な事項と対応（運用要領に基づく提案）</h2>
     ${(!probC.length&&!probD.length)?'<p class="muted">B・C評価の項目はありません。</p>':""}
     ${probC.length?`<h3 class="rh3">支援実施状況（チェックリスト）</h3>
       <table class="imp"><thead><tr><th class="w-e">評価</th><th>指摘事項</th><th>あるべき対応（改善提案）</th><th class="w-r">根拠</th></tr></thead><tbody>${
       probC.map(x=>`<tr><td>${evalTag(x.r.result)}</td>
         <td><div class="cat">${x.m.category_no}. ${esc(x.m.category)}</div>${esc(x.m.question)}${x.r.note?`<div class="note">所見：${esc(x.r.note)}</div>`:""}</td>
         <td>${esc(x.m.improvement||"")}</td>
         <td class="ref">運用要領別冊${x.m.ref_page?" "+esc(x.m.ref_page):""}</td></tr>`).join("")}</tbody></table>`:""}
     ${probD.length?`<h3 class="rh3">保管書類</h3>
       <table class="imp"><thead><tr><th class="w-e">評価</th><th>指摘事項</th><th>あるべき対応（改善提案）</th><th class="w-r">根拠</th></tr></thead><tbody>${
       probD.map(x=>`<tr><td>${evalTag(x.r.result)}</td>
         <td><div class="cat">${esc(x.d.ledger_group||"")}</div>${esc(x.d.doc_name)}${x.r.note?`<div class="note">所見：${esc(x.r.note)}</div>`:""}</td>
         <td>${esc(x.d.improvement||"")}</td>
         <td class="ref">${esc(x.d.ref||"")}</td></tr>`).join("")}</tbody></table>`:""}
     <h2 class="rh">3. 講評</h2>
     <p>${answered===0?"評価が未入力です。模擬監査を実施のうえ報告書を作成してください。":
        anyC?"重大な指摘（C）が認められます。下記の改善提案に沿って速やかに是正し、改善状況の再確認を推奨します。":
        anyB?"一部に改善の余地（B）があります。下記の改善提案に沿った是正を推奨します。":
        "運用要領の要件を満たしています。現状の運用継続を推奨します。"}</p>
     <div class="disc">本報告書はカンシス（模擬監査）の評価結果に基づき、特定技能 運用要領（1号特定技能外国人支援）を参照して作成しています。</div>
   </div>`;
};

routes.findings=async()=>{
  setHead("指摘管理","");
  const {data:fs}=await sb.from("k_v_findings_due").select("*");
  view.innerHTML=`<div class="card">${(fs&&fs.length)?`<table><thead><tr><th>機関名</th><th>指摘</th><th>分野</th><th>重要度</th><th>期限</th><th>残り</th><th>状態</th></tr></thead><tbody>${
    fs.map(f=>`<tr class="click" onclick="go('org','${f.audit_org_id}')"><td>${esc(f.org_name)}</td><td>${esc(f.content)}</td><td>${esc(f.category||"—")}</td><td>${sevTag(f.severity)}</td><td>${fmt(f.due_date)}</td>
      <td>${f.days_left==null?"—":(f.days_left<0?`<span class="tag r">${-f.days_left}日超過</span>`:`${f.days_left}日`)}</td>
      <td><span class="tag ${f.status==="対応中"?"a":"r"}">${esc(f.status)}</span></td></tr>`).join("")
  }</tbody></table>`:'<div class="empty">未完了の指摘はありません。</div>'}</div>`;
};

// ====== チェック様式（マスタ参照）======
function catGroupsHTML(items,rowFn){
  const cats={};items.forEach(m=>{(cats[m.category_no]=cats[m.category_no]||{name:m.category,items:[]}).items.push(m);});
  return Object.keys(cats).sort((a,b)=>a-b).map(cn=>{
    const c=cats[cn];const n=c.items.filter(i=>!i.is_note).length;
    return `<div class="catblock"><div class="cathead">${cn}. ${esc(c.name)}<span class="cnt">${n}項目</span></div>${c.items.map(rowFn).join("")}</div>`;
  }).join("");
}
routes.checklist=async()=>{
  setHead("監査チェックリスト（マスタ）","支援実施状況確認チェックリスト（11分野・54項目）");
  const {data}=await sb.from("k_checklist_master").select("*").eq("active",true).order("sort");
  if(!data){view.innerHTML='<div class="empty">読み込みに失敗しました</div>';return;}
  view.innerHTML=`<div class="card" style="padding:12px 16px;margin-bottom:14px"><span class="muted">模擬監査で使う標準チェック項目のマスタです。評価（A/B/C）は「模擬監査」画面で行います。項目の追加・修正はこのマスタが元になります。</span></div>`
   + catGroupsHTML(data, m=>`<div class="qrow"><div><div class="qtext">${m.item_no}. ${esc(m.question)}</div>${m.ref_page?`<div class="qmeta">別冊 ${esc(m.ref_page)}</div>`:""}</div><div></div></div>`);
};
routes.docs=async()=>{
  setHead("保管書類チェックリスト（マスタ）","登録支援機関 保管書類（15項目）");
  const {data}=await sb.from("k_doc_master").select("*").eq("active",true).order("sort");
  if(!data){view.innerHTML='<div class="empty">読み込みに失敗しました</div>';return;}
  view.innerHTML=`<div class="card" style="padding:12px 16px;margin-bottom:14px"><span class="muted">模擬監査で使う保管書類チェックのマスタです。評価（A/B/C）は「模擬監査」画面の②で行います。</span></div>
   <div class="card"><table><thead><tr><th>No</th><th>帳簿・書類／記載事項</th><th>様式</th><th>保存期間</th><th>根拠</th></tr></thead><tbody>${
    data.map(d=>`<tr><td>${d.no}</td><td><div class="qmeta muted" style="margin-bottom:2px">${esc(d.ledger_group||"")}</div><div class="qtext">${esc(d.doc_name)}</div></td><td>${esc(d.form_no||"")}</td><td>${esc(d.keep_period||"")}</td><td class="qmeta">${esc(d.ref||"")}</td></tr>`).join("")
  }</tbody></table></div>`;
};

// ====== 模擬監査 ======
routes.mock=async()=>{
  setHead("模擬監査","",btn("＋ 模擬監査を開始",startMock));
  const {data:audits}=await sb.from("k_audits").select("*,k_audit_orgs(name)").order("audit_date",{ascending:false,nullsFirst:false});
  const {data:cr}=await sb.from("k_checklist_results").select("audit_id,result");
  const prog={};(cr||[]).forEach(r=>{const p=prog[r.audit_id]=prog[r.audit_id]||{t:0,d:0};p.t++;if(r.result)p.d++;});
  view.innerHTML=`<div class="card" style="padding:12px 16px;margin-bottom:14px"><span class="muted">模擬監査はここから開始します。①監査チェックリスト（54項目）を1つずつ確認 → ②保管書類チェックリスト（15項目）の順で、各項目を A（問題なし）・B（一部問題あり）・C（問題あり）で評価します。</span></div>
   <div class="card">${(audits&&audits.length)?`<table><thead><tr><th>対象機関</th><th>監査日</th><th>種別</th><th>状態</th><th>進捗</th><th></th></tr></thead><tbody>${
     audits.map(a=>{const p=prog[a.id]||{t:0,d:0};return `<tr class="click" onclick="openAudit('${a.id}','${a.audit_org_id}')">
       <td><b>${esc(a.k_audit_orgs?.name||"—")}</b></td><td>${fmt(a.audit_date)}</td><td>${esc(a.audit_type||"")}</td>
       <td><span class="tag p">${esc(a.status||"")}</span></td><td>${p.d} / ${p.t||54}</td>
       <td><button class="btn sm ghost">開く</button></td></tr>`;}).join("")
   }</tbody></table>`:'<div class="empty">まだ模擬監査がありません。「＋ 模擬監査を開始」から始めてください。</div>'}</div>`;
};
async function startMock(){
  const {data:orgs}=await sb.from("k_audit_orgs").select("id,name").order("name");
  if(!orgs||!orgs.length){toast("先に監査対象機関を登録してください");go("orgs");return;}
  const opts=orgs.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("");
  modal("模擬監査を開始",`<div class="form">
     <label>対象機関 *</label><select name="org">${opts}</select>
     <label>監査日</label><input name="d" type="date" value="${new Date().toISOString().slice(0,10)}">
     <label>種別</label><select name="t"><option>模擬監査</option><option>定期</option><option>初回</option><option>フォローアップ</option></select>
     <label>方法</label><select name="mtd"><option>往査</option><option>オンライン</option><option>書面</option></select>
   </div><p class="muted" style="margin:10px 0 0">開始すると監査チェックリスト54項目の評価枠が生成され、監査画面に移ります。</p>`, async m=>{
     const orgId=val(m,"org");if(!orgId){toast("対象機関を選んでください");return false;}
     const {data:a,error}=await sb.from("k_audits").insert({audit_org_id:orgId,audit_date:val(m,"d")||null,audit_type:val(m,"t"),method:val(m,"mtd"),status:"実施中",status_changed_at:new Date().toISOString()}).select().single();
     if(error){toast("失敗:"+error.message);return false;}
     const {data:cm}=await sb.from("k_checklist_master").select("id").eq("active",true);
     if(cm&&cm.length)await sb.from("k_checklist_results").insert(cm.map(r=>({audit_id:a.id,master_id:r.id})));
     await sb.from("k_audit_orgs").update({audit_status:"監査中"}).eq("id",orgId);
     toast("模擬監査を開始しました");openAudit(a.id,orgId);
   },"開始する");
}

// 起動
go("mock");
</script>
